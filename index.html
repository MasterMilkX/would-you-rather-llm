<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Would You Rather LLM</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:      #5b8fff;
    --teal-dark: #2e5bcc;
    --teal-dim:  #1e3569;
    --bg:        #04060f;
    --win-bg:    #080d1e;
    --text:      #e8edff;
    --text-dim:  #6688ee;
    --pink:      #ff3a00;
    --yellow:    #ff8c00;
    --scan: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
    );
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 52%, #ff2200 0%, #a01000 18%, transparent 42%),
      radial-gradient(ellipse at 50% 52%, #5a0a00 0%, transparent 65%),
      radial-gradient(ellipse at 20% 85%, #060d28 0%, transparent 55%);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text); min-height: 100vh; overflow-x: hidden; cursor: default;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background: var(--scan); pointer-events: none; z-index: 9999; opacity: 0.4;
  }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(90deg, var(--teal-dim), var(--teal-dark), var(--teal-dim));
    padding: 6px 12px; border-bottom: 2px solid var(--teal);
    position: sticky; top: 0; z-index: 100;
  }
  .titlebar-btns { display: flex; gap: 6px; }
  .titlebar-btn {
    height:14px;padding:0 5px;border:1px solid var(--bg);background:var(--yellow);
    font-size:9px;display:flex;align-items:center;justify-content:center;
    color:var(--bg);cursor:pointer;font-family:'VT323',monospace;font-weight:bold;
    white-space:nowrap;
  }
  .titlebar-title { font-family:'VT323',monospace;font-size:1.1rem;color:var(--bg);letter-spacing:2px; }
  header { text-align:center; padding:2.5rem 1rem 1rem; }
  .logo {
    font-family:'VT323',monospace;font-size:clamp(2.8rem,7vw,5rem);color:var(--teal);
    text-shadow:0 0 10px var(--teal),0 0 30px var(--teal-dark),2px 2px 0 var(--teal-dim);
    letter-spacing:4px;animation:glitch 4s infinite;
  }
  @keyframes glitch {
    0%,94%,100%{text-shadow:0 0 10px var(--teal),0 0 30px var(--teal-dark),2px 2px 0 var(--teal-dim);transform:none;}
    95%{transform:translate(-2px,0);text-shadow:2px 0 var(--pink),-2px 0 var(--teal);}
    97%{transform:translate(2px,0);text-shadow:-2px 0 var(--yellow),2px 0 var(--teal);}
    99%{transform:translate(0,1px);}
  }
  .subtitle{font-size:0.8rem;color:var(--text-dim);letter-spacing:3px;margin-top:6px;}
  .countdown-bar{text-align:center;padding:1rem;font-size:0.98rem;letter-spacing:2px;color:var(--text-dim);font-weight: bold;}
  .countdown-bar span{color:var(--teal);font-family:'VT323',monospace;font-size:1.25rem;font-weight: bold;}
  .gen-time{color:var(--text-dim);font-size:0.7rem;letter-spacing:2px;text-align:center;margin-bottom:1rem;font-weight: bold;}
  .status{font-weight:bold;text-align:center;font-size:0.78rem;color:var(--text-dim);letter-spacing:2px;min-height:1.2em;margin-bottom:1rem;padding:0 1rem;}
  .status.loading{color:var(--teal);animation:blink 0.8s infinite;}
  .status.error{color:var(--pink);}
  @keyframes blink{50%{opacity:0.3;}}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;max-width:1400px;margin:0 auto;padding:0 20px 60px;}
  .win{
    border:2px solid var(--teal);background:var(--win-bg);
    box-shadow:0 0 0 1px var(--teal-dim),4px 4px 0 var(--teal-dim),0 0 20px rgba(91,143,255,0.12);
    opacity:0;transform:translateY(16px);transition:opacity 0.4s,transform 0.4s;
  }
  .win.visible{opacity:1;transform:none;}
  .win:nth-child(1){transition-delay:0.05s;}.win:nth-child(2){transition-delay:0.12s;}.win:nth-child(3){transition-delay:0.19s;}
  .win:nth-child(4){transition-delay:0.26s;}.win:nth-child(5){transition-delay:0.33s;}.win:nth-child(6){transition-delay:0.40s;}
  .win-title{
    background:linear-gradient(90deg,var(--teal-dim),var(--teal-dark));
    padding:5px 10px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--teal);
  }
  .win-title span{font-family:'VT323',monospace;font-size:1rem;color:var(--bg);letter-spacing:2px;}
  .win-controls{display:flex;gap:8px;}
  .win-ctrl{width:24px;height:24px;background:transparent;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--teal);cursor:pointer;font-family:'VT323',monospace;transition:opacity 0.15s;position:relative;}
  .win-ctrl.feedback-selected{filter:drop-shadow(0 0 6px #ff4400) drop-shadow(0 0 14px #ff2200) drop-shadow(0 0 28px #ff0000);opacity:1;}
  .win-ctrl.feedback-disabled{opacity:0.18;cursor:default;pointer-events:none;}
  .win-ctrl[data-tip]::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
    background:var(--bg);border:1px solid var(--teal-dim);color:var(--teal);
    font-family:'Share Tech Mono',monospace;font-size:0.6rem;letter-spacing:1px;
    white-space:nowrap;padding:3px 7px;pointer-events:none;
    opacity:0;transition:opacity 0.15s;z-index:200;
  }
  .win-ctrl[data-tip]:not(.feedback-disabled):hover::after{opacity:1;}
  .win-body{padding:18px;}
  .wyr-prompt{font-family:'VT323',monospace;font-size:1.3rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:14px;text-align:center;}
  .option-btn{
    width:100%;padding:14px 12px;margin-bottom:10px;background:transparent;
    border:1px solid var(--teal-dim);color:var(--text);font-family:'Share Tech Mono',monospace;
    font-size:0.85rem;text-align:left;cursor:pointer;transition:all 0.15s;line-height:1.4;
  }
  .option-btn::before{content:'▶ ';color:var(--teal-dim);font-size:0.7rem;}
  .option-btn:hover:not(:disabled){border-color:var(--teal);background:rgba(91,143,255,0.08);color:var(--teal);}
  .option-btn:hover:not(:disabled)::before{color:var(--teal);}
  .option-btn.selected-a{border-color:var(--pink);background:rgba(91,143,255,0.14);color:var(--pink);}
  .option-btn.selected-b{border-color:var(--pink);background:rgba(255,58,0,0.12);color:var(--pink);}
  .option-btn:disabled{cursor:default;}
  .option-btn.placeholder{color:var(--teal-dim);font-style:italic;}
  .results{margin-top:14px;display:none;border-top:1px dashed var(--teal-dim);padding-top:12px;}
  .results.show{display:block;}
  .result-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:0.75rem;color:var(--text-dim);letter-spacing:1px;}
  .result-label{color:var(--teal);}
  .bar-wrap{display:flex;align-items:center;gap:6px;}
  .bar{height:8px;background:var(--teal-dim);display:inline-block;transition:width 0.5s;min-width:2px;}
  .bar.voted{background:var(--pink);}
  .reveal-tag{font-size:0.7rem;color:var(--pink);margin-top:10px;letter-spacing:1px;text-align:center;}
  .voted-badge{font-size:0.7rem;color:var(--yellow);letter-spacing:1px;text-align:center;margin-bottom:6px;}
  footer{text-align:center;padding:20px;font-size:0.7rem;color:var(--teal);letter-spacing:2px;border-top:1px solid var(--yellow);}
  ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--teal-dim);}
  @media(max-width:640px){
    .titlebar { padding: 6px 8px; }
    .titlebar-title { font-size: 0.85rem; letter-spacing: 1px; }
    header { padding: 1.2rem 1rem 0.6rem; }
    .logo { font-size: 2rem; letter-spacing: 2px; }
    .subtitle { font-size: 0.7rem; letter-spacing: 2px; }
    .countdown-bar { font-size: 0.72rem; padding: 0.6rem; }
    .gen-time { font-size: 0.65rem; }
    .status { font-size: 0.72rem; padding: 0 0.75rem; }
    .grid {
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 0 12px 40px;
    }
    .win-body { padding: 12px; }
    .wyr-prompt { font-size: 1.1rem; margin-bottom: 10px; }
    .option-btn {
      padding: 18px 12px;
      font-size: 0.82rem;
      margin-bottom: 8px;
    }
    .result-row { font-size: 0.7rem; }
    .bar { height: 6px; }
    footer { font-size: 0.62rem; padding: 14px; }
  }
</style>
</head>
<body>

<div class="titlebar">
  <div class="titlebar-btns">
    <div class="titlebar-btn" onclick="window.open('https://gamegoogle.drmilkx.xyz/', '_blank')">GG</div><div class="titlebar-btn" onclick="window.open('https://gamecaptcha.drmilkx.xyz/', '_blank')">GC</div><div class="titlebar-btn"><-- other links!</div>
  </div>
  <div class="titlebar-title">WYR_LLM.EXE — RUNNING</div>
  <div style="font-size:0.65rem;color:var(--yellow);letter-spacing:1px;" id="clock"></div>
</div>

<header>
  <div class="logo">WOULD YOU RATHER-INATOR</div>
  <!-- <div class="subtitle">&nbsp;</div> -->
</header>

<div class="countdown-bar">NEXT QUESTION IN: <span id="countdown">--:--:--</span></div>
<div class="gen-time" id="genTime"></div>
<div class="status" id="status">LOADING QUESTION_</div>

<div class="grid" id="grid">
  <div class="win" id="card-A"></div>
  <div class="win" id="card-B"></div>
  <div class="win" id="card-C"></div>
  <div class="win" id="card-D"></div>
  <div class="win" id="card-E"></div>
  <div class="win" id="card-F"></div>
</div>

<footer>[ WOULD YOU RATHER LLM // ALL OUTPUTS AI GENERATED // THIS IS FOR RESEARCH PURPOSES ONLY - NO PERSONAL DATA IS COLLECTED; ONLY VOTES // <span onclick="window.open('https://ai.google.dev/gemma/terms', '_blank')">Gemma Terms of Use</span> ]</footer>

<script>
const SLOTS = ['A','B','C','D','E','F'];
let state = { questionId: null, voted: false };

function voteKey(qid) { return `wyr_votes_${qid}`; }
function getSavedVotes(qid) {
  try { return JSON.parse(localStorage.getItem(voteKey(qid))) || {}; }
  catch { return {}; }
}
function saveVote(qid, slot, option) {
  const v = getSavedVotes(qid);
  v[slot] = option;
  localStorage.setItem(voteKey(qid), JSON.stringify(v));
}

const FEEDBACK_TYPES = ['UPVOTE','DOWNVOTE','FLAG'];
function feedbackKey(qid) { return `wyr_feedback_${qid}`; }
function getSavedFeedback(qid) {
  try { return JSON.parse(localStorage.getItem(feedbackKey(qid))) || {}; }
  catch { return {}; }
}
function saveFeedback(qid, slot, type) {
  const f = getSavedFeedback(qid);
  f[slot] = type;
  localStorage.setItem(feedbackKey(qid), JSON.stringify(f));
}
function lockFeedback(slot, chosen) {
  for (const type of FEEDBACK_TYPES) {
    const el = document.getElementById(`fb-${slot}-${type}`);
    if (!el) continue;
    el.classList.toggle('feedback-selected', type === chosen);
    el.classList.toggle('feedback-disabled',  type !== chosen);
  }
}

function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US',{hour12:false});
}
tick(); setInterval(tick, 1000);

function updateCountdown() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(next.getHours()+1,0,0,0);
  const diff = Math.max(0, next-now);
  const h = String(Math.floor(diff/3600000)).padStart(2,'0');
  const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  document.getElementById('countdown').textContent = `${h}:${m}:${s}`;
  if (diff < 1000 && state.questionId) setTimeout(()=>loadQuestion(), 5000);
}
setInterval(updateCountdown,1000); updateCountdown();

function buildCard(slot) {
  const el = document.getElementById(`card-${slot}`);
  el.classList.remove('visible');
  el.innerHTML = `
    <div class="win-title">
      <span>MODEL_${slot}.EXE</span>
      <div class="win-controls">
        <div class="win-ctrl" id="fb-${slot}-UPVOTE"   data-tip="GOOD QUESTION"  onclick="submitModelFeedback('${slot}','UPVOTE')"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#dedede"><path d="M720-120H280v-520l280-280 50 50q7 7 11.5 19t4.5 23v14l-44 174h258q32 0 56 24t24 56v80q0 7-2 15t-4 15L794-168q-9 20-30 34t-44 14Zm-360-80h360l120-280v-80H480l54-220-174 174v406Zm0-406v406-406Zm-80-34v80H160v360h120v80H80v-520h200Z"/></svg></div>
        <div class="win-ctrl" id="fb-${slot}-DOWNVOTE" data-tip="BAD QUESTION"   onclick="submitModelFeedback('${slot}','DOWNVOTE')"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#dedede"><path d="M240-840h440v520L400-40l-50-50q-7-7-11.5-19t-4.5-23v-14l44-174H120q-32 0-56-24t-24-56v-80q0-7 2-15t4-15l120-282q9-20 30-34t44-14Zm360 80H240L120-480v80h360l-54 220 174-174v-406Zm0 406v-406 406Zm80 34v-80h120v-360H680v-80h200v520H680Z"/></svg></div>
        <div class="win-ctrl" id="fb-${slot}-FLAG"     data-tip="FLAG CONTENT"   onclick="submitModelFeedback('${slot}','FLAG')"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#dedede"><path d="M200-120v-680h360l16 80h224v400H520l-16-80H280v280h-80Zm300-440Zm86 160h134v-240H510l-16-80H280v240h290l16 80Z"/></svg></div>
      </div>
    </div>
    <div class="win-body">
      <div class="wyr-prompt">Would you rather...</div>
      <button class="option-btn placeholder" disabled>[ LOADING... ]</button>
      <button class="option-btn placeholder" disabled>[ LOADING... ]</button>
    </div>`;
  setTimeout(()=>el.classList.add('visible'),10);
}

function populateCard(slot, optA, optB) {
  document.getElementById(`card-${slot}`).querySelector('.win-body').innerHTML = `
    <div class="wyr-prompt">Would you rather...</div>
    <button class="option-btn" id="obtn-${slot}-A" onclick="pickOption('${slot}','A')">${esc(optA)}</button>
    <button class="option-btn" id="obtn-${slot}-B" onclick="pickOption('${slot}','B')">${esc(optB)}</button>
    <div class="results" id="results-${slot}"></div>`;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadQuestion() {
  setStatus('loading','LOADING QUESTION_');
  SLOTS.forEach(buildCard);
  state.voted = false;
  try {
    const resp = await fetch('/api/question');
    if (!resp.ok){ const e=await resp.json(); setStatus('error',e.error||'FAILED TO LOAD'); return; }
    const data = await resp.json();
    state.questionId = data.question_id;
    const gt = new Date(data.generated_at+'Z');
    document.getElementById('genTime').textContent =
      `GENERATED AT: ${gt.toLocaleTimeString('en-US',{hour12:false})}`;
    SLOTS.forEach(slot=>{ const s=data.slots[slot]; if(s) populateCard(slot,s.option_a,s.option_b); });
    await restoreSavedVotes(data.question_id);
  } catch(e){ setStatus('error','CONNECTION ERROR: '+e.message); }
}

function pickOption(slot, option) {
  if (document.getElementById(`results-${slot}`).classList.contains('show')) return;
  const btnA = document.getElementById(`obtn-${slot}-A`);
  const btnB = document.getElementById(`obtn-${slot}-B`);
  if (!btnA) return;
  btnA.disabled=true; btnB.disabled=true;
  btnA.classList.toggle('selected-a', option==='A');
  btnB.classList.toggle('selected-b', option==='B');
  state.voted = true;
  submitVote(slot, option);
}

async function submitVote(slot, chosenOption) {
  setStatus('loading','RECORDING VOTE_');
  try {
    const resp = await fetch('/api/vote',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question_id:state.questionId, slot, chosen_option:chosenOption})
    });
    const data = await resp.json();
    if (!resp.ok){ setStatus('error',data.error); return; }
    saveVote(state.questionId, slot, chosenOption);
    showResults(slot, data.totals, data.slot_reveal, chosenOption);
    setStatus('','VOTE RECORDED // MODELS REVEALED BELOW_');
  } catch(e){ setStatus('error','VOTE ERROR: '+e.message); }
}

function submitModelFeedback(slot, feedback) {
  lockFeedback(slot, feedback);
  saveFeedback(state.questionId, slot, feedback);
  fetch('/api/moderate', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question_id: state.questionId, slot, vote_type: feedback})
  }).then(resp => {
    if (!resp.ok) console.error('Feedback submission failed');
  }).catch(e => console.error('Feedback submission error:', e));
}

function showResults(slot, totals, slotReveal, chosenOption) {
    const modelName = slotReveal[slot];
    if (!modelName||!totals[modelName]) return;
    const t = totals[modelName];
    const total = (t.votes_a+t.votes_b)||1;
    const pctA = Math.round(t.votes_a/total*100);
    const pctB = 100-pctA;
    const el = document.getElementById(`results-${slot}`);
    if (!el) return;
    //      ${slot===slot?`<div class="voted-badge">★ YOU VOTED ${chosenOption==='A'?'OPTION A':'OPTION B'} ★</div>`:''}

    el.innerHTML = `
      <div class="result-row">
        <span class="result-label">OPT A</span>
        <div class="bar-wrap"><span class="bar ${chosenOption==='A'?'voted':''}" style="width:${Math.round(pctA*.9)}px"></span><span>${t.votes_a}v / ${pctA}%</span></div>
      </div>
      <div class="result-row">
        <span class="result-label">OPT B</span>
        <div class="bar-wrap"><span class="bar ${chosenOption==='B'?'voted':''}" style="width:${Math.round(pctB*.9)}px"></span><span>${t.votes_b}v / ${pctB}%</span></div>
      </div>
      <div class="reveal-tag">★ MODEL: ${modelName.toUpperCase()} ★</div>`;
    el.classList.add('show');
}

async function restoreSavedVotes(qid) {
  const savedFeedback = getSavedFeedback(qid);
  for (const [slot, type] of Object.entries(savedFeedback)) lockFeedback(slot, type);

  const saved = getSavedVotes(qid);
  const votedSlots = Object.keys(saved);

  if (votedSlots.length === 0) {
    setStatus('', 'CLICK AN OPTION ON ANY CARD TO CAST YOUR VOTE_');
    return;
  }

  // Restore button state unconditionally — doesn't need the API
  for (const slot of votedSlots) {
    const chosenOption = saved[slot];
    const btnA = document.getElementById(`obtn-${slot}-A`);
    const btnB = document.getElementById(`obtn-${slot}-B`);
    if (!btnA) continue;
    btnA.disabled = true; btnB.disabled = true;
    btnA.classList.toggle('selected-a', chosenOption === 'A');
    btnB.classList.toggle('selected-b', chosenOption === 'B');
  }

  state.voted = true;
  const remaining = SLOTS.filter(s => !saved[s]).length;
  setStatus('', remaining > 0
    ? `PREVIOUS VOTES RESTORED // ${remaining} CARD${remaining > 1 ? 'S' : ''} REMAINING_`
    : 'ALL VOTES CAST // RESULTS SHOWN_');

  // Fetch current vote counts and show results — best-effort, silent on failure
  try {
    const resp = await fetch(`/api/results/${qid}`);
    if (!resp.ok) return;
    const data = await resp.json();
    for (const slot of votedSlots) {
      showResults(slot, data.totals, data.slot_reveal, saved[slot]);
    }
  } catch(e) { /* results unavailable, button state already restored above */ }
}

function setStatus(cls,msg){
  const el=document.getElementById('status');
  el.className='status'+(cls?' '+cls:'');
  el.textContent=msg;
}

loadQuestion();
</script>
</body>
</html>
