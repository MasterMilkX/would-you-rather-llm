<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Would You Rather LLM</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:      #a6fff8;
    --teal-dark: #5ce8df;
    --teal-dim:  #2a6e6a;
    --bg:        #0a1a1a;
    --win-bg:    #0d2b2b;
    --win-border:#a6fff8;
    --win-title: #a6fff8;
    --text:      #c8fffc;
    --text-dim:  #5ce8df;
    --btn-bg:    #0d2b2b;
    --btn-hover: #a6fff8;
    --btn-text:  #a6fff8;
    --btn-text-h:#0a1a1a;
    --pink:      #ff6ef7;
    --yellow:    #fffb6e;
    --scan: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 20%, #0d3535 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #0a2828 0%, transparent 50%);
    font-family: 'Share Tech Mono', monospace;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    cursor: crosshair;
  }

  /* scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--scan);
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* ── TITLE BAR ── */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, var(--teal-dim), var(--teal-dark), var(--teal-dim));
    padding: 6px 12px;
    border-bottom: 2px solid var(--teal);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .titlebar-btns { display: flex; gap: 6px; }
  .titlebar-btn {
    width: 14px; height: 14px;
    border: 1px solid var(--bg);
    background: var(--teal);
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    color: var(--bg); cursor: pointer; font-family: 'VT323', monospace;
    font-weight: bold;
  }
  .titlebar-title {
    font-family: 'VT323', monospace;
    font-size: 1.1rem;
    color: var(--bg);
    letter-spacing: 2px;
    text-shadow: none;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
  }
  .logo {
    font-family: 'VT323', monospace;
    font-size: clamp(2.8rem, 7vw, 5rem);
    color: var(--teal);
    text-shadow:
      0 0 10px var(--teal),
      0 0 30px var(--teal-dark),
      2px 2px 0 var(--teal-dim);
    letter-spacing: 4px;
    animation: glitch 4s infinite;
  }
  @keyframes glitch {
    0%,94%,100% { text-shadow: 0 0 10px var(--teal), 0 0 30px var(--teal-dark), 2px 2px 0 var(--teal-dim); transform: none; }
    95% { transform: translate(-2px,0); text-shadow: 2px 0 var(--pink), -2px 0 var(--teal); }
    97% { transform: translate(2px,0);  text-shadow: -2px 0 var(--yellow), 2px 0 var(--teal); }
    99% { transform: translate(0,1px); }
  }
  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-top: 6px;
  }

  /* ── GENERATE BUTTON ── */
  .gen-wrap { display: flex; justify-content: center; padding: 1.2rem 0 2rem; }
  .gen-btn {
    font-family: 'VT323', monospace;
    font-size: 1.6rem;
    letter-spacing: 3px;
    padding: 10px 40px;
    background: transparent;
    color: var(--teal);
    border: 2px solid var(--teal);
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    text-transform: uppercase;
    box-shadow: 0 0 12px rgba(166,255,248,0.3), inset 0 0 12px rgba(166,255,248,0.05);
  }
  .gen-btn::before, .gen-btn::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border-color: var(--teal); border-style: solid;
  }
  .gen-btn::before { top:-4px; left:-4px; border-width: 2px 0 0 2px; }
  .gen-btn::after  { bottom:-4px; right:-4px; border-width: 0 2px 2px 0; }
  .gen-btn:hover {
    background: var(--teal);
    color: var(--bg);
    box-shadow: 0 0 30px rgba(166,255,248,0.6), inset 0 0 20px rgba(166,255,248,0.1);
  }
  .gen-btn:active { transform: scale(0.97); }
  .gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── STATUS LINE ── */
  .status {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    min-height: 1.2em;
    margin-bottom: 1rem;
  }
  .status.loading { color: var(--teal); animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ── WINDOW CARD ── */
  .win {
    border: 2px solid var(--win-border);
    background: var(--win-bg);
    box-shadow: 0 0 0 1px var(--teal-dim), 4px 4px 0 var(--teal-dim), 0 0 20px rgba(166,255,248,0.1);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s, transform 0.4s, box-shadow 0.2s;
  }
  .win.visible { opacity: 1; transform: none; }
  .win:nth-child(1) { transition-delay: 0.05s; }
  .win:nth-child(2) { transition-delay: 0.15s; }
  .win:nth-child(3) { transition-delay: 0.25s; }
  .win:nth-child(4) { transition-delay: 0.35s; }

  .win-title {
    background: linear-gradient(90deg, var(--teal-dim), var(--teal-dark));
    padding: 5px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--win-border);
  }
  .win-title span {
    font-family: 'VT323', monospace;
    font-size: 1rem;
    color: var(--bg);
    letter-spacing: 2px;
  }
  .win-controls { display: flex; gap: 4px; }
  .win-ctrl {
    width: 12px; height: 12px;
    background: var(--bg);
    border: 1px solid var(--bg);
    font-size: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--teal); font-family: 'VT323'; font-weight: bold;
  }

  .win-body { padding: 18px; }

  .wyr-prompt {
    font-family: 'VT323', monospace;
    font-size: 1.3rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-align: center;
  }

  /* ── OPTION BUTTONS ── */
  .option-btn {
    width: 100%;
    padding: 14px 12px;
    margin-bottom: 10px;
    background: transparent;
    border: 1px solid var(--teal-dim);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
    position: relative;
  }
  .option-btn::before {
    content: '▶ ';
    color: var(--teal-dim);
    font-size: 0.7rem;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--teal);
    background: rgba(166,255,248,0.07);
    color: var(--teal);
    box-shadow: inset 0 0 10px rgba(166,255,248,0.1);
  }
  .option-btn:hover:not(:disabled)::before { color: var(--teal); }
  .option-btn.selected-a {
    border-color: var(--teal);
    background: rgba(166,255,248,0.12);
    color: var(--teal);
  }
  .option-btn.selected-b {
    border-color: var(--pink);
    background: rgba(255,110,247,0.08);
    color: var(--pink);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.placeholder { color: var(--teal-dim); font-style: italic; }

  /* ── VOTE SECTION (shown after option pick) ── */
  .vote-section {
    margin-top: 14px;
    display: none;
    border-top: 1px dashed var(--teal-dim);
    padding-top: 12px;
  }
  .vote-section.show { display: block; }
  .vote-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-align: center;
  }
  .model-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .model-btn {
    flex: 1;
    padding: 7px 4px;
    background: transparent;
    border: 1px solid var(--teal-dim);
    color: var(--text-dim);
    font-family: 'VT323', monospace;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
  }
  .model-btn:hover:not(:disabled) {
    border-color: var(--teal);
    color: var(--teal);
    background: rgba(166,255,248,0.07);
  }
  .model-btn.voted {
    border-color: var(--yellow);
    color: var(--yellow);
    background: rgba(255,251,110,0.08);
  }

  /* ── RESULTS overlay ── */
  .results {
    margin-top: 12px;
    display: none;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    line-height: 1.8;
    border-top: 1px dashed var(--teal-dim);
    padding-top: 10px;
  }
  .results.show { display: block; }
  .result-row { display: flex; justify-content: space-between; }
  .result-model { color: var(--teal); }
  .result-bar {
    display: inline-block;
    height: 8px;
    background: var(--teal-dim);
    margin-left: 6px;
    vertical-align: middle;
    transition: width 0.5s;
  }
  .reveal-tag {
    font-size: 0.7rem;
    color: var(--pink);
    margin-top: 8px;
    letter-spacing: 1px;
    text-align: center;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.7rem;
    color: var(--teal-dim);
    letter-spacing: 2px;
    border-top: 1px solid var(--teal-dim);
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--teal-dim); }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .logo { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<!-- OS titlebar -->
<div class="titlebar">
  <div class="titlebar-btns">
    <div class="titlebar-btn">■</div>
    <div class="titlebar-btn">▼</div>
    <div class="titlebar-btn">✕</div>
  </div>
  <div class="titlebar-title">WYR LLM COMPARISON</div>
  <div style="font-size:0.65rem;color:var(--bg);letter-spacing:1px;" id="clock"></div>
</div>

<header>
  <div class="logo">WOULD YOU RATHER LLM</div>
  <div class="subtitle">&nbsp;</div>
</header>

<div class="gen-wrap">
  <button class="gen-btn" id="genBtn" onclick="generate()">▶ GENERATE</button>
</div>
<div class="status" id="status">Click to start!</div>

<div class="grid" id="grid">
  <!-- 4 cards injected by JS -->
  <div class="win" id="card-A"></div>
  <div class="win" id="card-B"></div>
  <div class="win" id="card-C"></div>
  <div class="win" id="card-D"></div>
</div>

<footer>
  [ WOULD YOU RATHER LLM  // ALL OUTPUTS AI GENERATED ]
</footer>

<script>
const LABELS = ['A','B','C','D'];
let currentQuestionId = null;
let votedOption = null;   // 'A' or 'B'
let votedModel  = null;   // 'A','B','C','D'
let currentModels = {};   // label -> {option_a, option_b}

// Clock
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', {hour12:false});
}
tick(); setInterval(tick, 1000);

// Build empty card shell
function buildCard(label) {
  const el = document.getElementById(`card-${label}`);
  el.classList.remove('visible');
  el.innerHTML = `
    <div class="win-title">
      <span>MODEL_${label}.EXE</span>
      <div class="win-controls">
        <div class="win-ctrl">_</div>
        <div class="win-ctrl">□</div>
        <div class="win-ctrl">✕</div>
      </div>
    </div>
    <div class="win-body">
      <div class="wyr-prompt">Would you rather...</div>
      <button class="option-btn placeholder" disabled>[ GENERATING... ]</button>
      <button class="option-btn placeholder" disabled>[ GENERATING... ]</button>
      <div class="vote-section" id="vote-${label}">
        <div class="vote-label">WHICH MODEL DO YOU PREFER?</div>
        <div class="model-btns">
          ${LABELS.map(l => `<button class="model-btn" id="mbtn-${label}-${l}" onclick="voteModel('${label}','${l}')">${l}</button>`).join('')}
        </div>
      </div>
      <div class="results" id="results-${label}"></div>
    </div>`;
  setTimeout(() => el.classList.add('visible'), 10);
}

function populateCard(label, optA, optB) {
  const el = document.getElementById(`card-${label}`);
  const body = el.querySelector('.win-body');
  body.innerHTML = `
    <div class="wyr-prompt">Would you rather...</div>
    <button class="option-btn" id="obtn-${label}-A"
      onclick="pickOption('${label}','A')">
      ${escHtml(optA)}
    </button>
    <button class="option-btn" id="obtn-${label}-B"
      onclick="pickOption('${label}','B')">
      ${escHtml(optB)}
    </button>
    <div class="vote-section" id="vote-${label}">
      <div class="vote-label">WHICH MODEL DO YOU PREFER?</div>
      <div class="model-btns">
        ${LABELS.map(l => `<button class="model-btn" id="mbtn-${label}-${l}" onclick="voteModel('${label}','${l}')">${l}</button>`).join('')}
      </div>
    </div>
    <div class="results" id="results-${label}"></div>`;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function generate() {
  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status loading';
  status.textContent = 'LOADING MODELS... PLEASE WAIT_';
  currentQuestionId = null; votedOption = null; votedModel = null;

  LABELS.forEach(buildCard);

  try {
    const resp = await fetch('/api/generate', {method:'POST'});
    const data = await resp.json();
    currentQuestionId = data.question_id;
    currentModels = data.models;

    LABELS.forEach(label => {
      const m = data.models[`Model ${label}`];
      if (m) populateCard(label, m.option_a, m.option_b);
    });

    status.className = 'status';
    status.textContent = 'SELECT AN OPTION FROM ANY CARD TO VOTE_';
  } catch(e) {
    status.className = 'status';
    status.textContent = 'ERROR: ' + e.message;
  }

  btn.disabled = false;
}

function pickOption(cardLabel, option) {
  // Highlight selected option on this card
  const btnA = document.getElementById(`obtn-${cardLabel}-A`);
  const btnB = document.getElementById(`obtn-${cardLabel}-B`);
  if (!btnA) return;

  btnA.disabled = true; btnB.disabled = true;
  btnA.classList.toggle('selected-a', option === 'A');
  btnB.classList.toggle('selected-b', option === 'B');

  votedOption = option;

  // Show model preference vote section
  document.getElementById(`vote-${cardLabel}`).classList.add('show');
  document.getElementById('status').textContent =
    `OPTION ${option} SELECTED — NOW PICK YOUR FAVOURITE MODEL_`;
}

async function voteModel(cardLabel, modelLabel) {
  if (!currentQuestionId || !votedOption) return;

  // Highlight chosen model btn
  LABELS.forEach(l => {
    const b = document.getElementById(`mbtn-${cardLabel}-${l}`);
    if (b) { b.disabled = true; b.classList.toggle('voted', l === modelLabel); }
  });

  votedModel = modelLabel;

  try {
    const resp = await fetch('/api/vote', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        question_id: currentQuestionId,
        chosen_option: votedOption,
        preferred_model: modelLabel,
      })
    });
    const data = await resp.json();
    showResults(cardLabel, data.tallies, data.reveal);
    document.getElementById('status').textContent =
      'VOTE RECORDED // THANKS FOR PARTICIPATING_';
  } catch(e) {
    document.getElementById('status').textContent = 'VOTE ERROR: ' + e.message;
  }
}

function showResults(cardLabel, tallies, reveal) {
  const el = document.getElementById(`results-${cardLabel}`);
  const total = Object.values(tallies).reduce((a,b)=>a+b,0) || 1;
  let html = '';
  LABELS.forEach(l => {
    const cnt = tallies[l] || 0;
    const pct = Math.round(cnt/total*100);
    const barW = Math.round(pct * 0.8);
    const realModel = reveal[l] || '???';
    html += `<div class="result-row">
      <span class="result-model">MDL_${l} [${realModel}]</span>
      <span>${cnt}v <span class="result-bar" style="width:${barW}px"></span> ${pct}%</span>
    </div>`;
  });
  html += `<div class="reveal-tag">★ MODELS REVEALED ABOVE ★</div>`;
  el.innerHTML = html;
  el.classList.add('show');
}
</script>
</body>
</html>
